[package]
name = "sara-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
ansi-to-tui = "7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
shlex = "2"
unicode-segmentation = "1"
