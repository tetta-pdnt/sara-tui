[package]
name = "sara-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal UI for Sara requirements and traceability"
repository = "https://github.com/tetta-pdnt/sara-tui"
readme = "README.md"
license = "MIT"

[dependencies]
ansi-to-tui = "7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
open = "5"
percent-encoding = "2"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
shlex = "2"
unicode-segmentation = "1"
